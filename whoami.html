<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>מי אני?</title>
<style>
  :root{
    --ink:#1c2b3a;
    --paper:#f6f2ea;
    --card:#ffffff;
    --accent:#8a6d3b;
    --line:#d9d0bf;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    padding:40px 20px;
    background:var(--paper);
    font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
    color:var(--ink);
    min-height:100vh;
  }
  .wrap{max-width:1000px;margin:0 auto;}
  h1{
    text-align:center;
    font-size:2.1em;
    letter-spacing:1px;
    margin-bottom:6px;
  }
  .sub{
    text-align:center;
    color:#5c5346;
    margin-bottom:40px;
    font-size:1.05em;
  }
  .grid{
    display:flex;
    flex-direction:row;
    justify-content:center;
    align-items:flex-start;
    gap:28px;
    flex-wrap:wrap;
  }
  .scene{
    perspective:1400px;
    width:240px;
    height:340px;
    cursor:pointer;
    flex:0 0 auto;
  }
  .card{
    position:relative;
    width:100%;
    height:100%;
    transition:transform 0.7s cubic-bezier(.4,.2,.2,1);
    transform-style:preserve-3d;
  }
  .scene.flipped .card{
    transform:rotateY(180deg);
  }
  .face{
    position:absolute;
    inset:0;
    backface-visibility:hidden;
    border-radius:14px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:20px;
    border:2px solid var(--line);
    box-shadow:0 4px 14px rgba(0,0,0,0.08);
  }
  .front{
    background:var(--card);
  }
  .front .qmark{
    font-size:2.6em;
    color:var(--accent);
    margin-bottom:14px;
  }
  .clues{
    display:flex;
    flex-direction:column;
    gap:10px;
    width:100%;
  }
  .clue{
    display:flex;
    align-items:center;
    gap:10px;
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:8px;
    padding:8px 12px;
    font-size:0.98em;
  }
  .clue .icon{font-size:1.3em;}
  .hint{
    margin-top:16px;
    font-size:0.85em;
    color:#8a8172;
  }
  .back{
    background:var(--ink);
    color:#fff;
    transform:rotateY(180deg);
  }
  .back .icon-big{
    font-size:3.4em;
    margin-bottom:10px;
  }
  .back .answer{
    font-size:1.6em;
    font-weight:600;
    letter-spacing:0.5px;
  }

  .card-img{
    width:100%;
    height:70%;
    object-fit:contain;
    border-radius:8px;
  }
  .back-img{
    width:100%;
    height:75%;
    object-fit:contain;
    border-radius:8px;
    background:#fff;
  }
  .caption{
    margin-top:10px;
    font-size:1.3em;
    font-weight:600;
    letter-spacing:0.5px;
  }
  .footer-note{
    text-align:center;
    margin-top:36px;
    color:#8a8172;
    font-size:0.9em;
  }
</style>
</head>
