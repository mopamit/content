<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>יהדות ארצות המזרח - פתיחה</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@500;700;900&family=Heebo:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --parchment:#EFE4C6;
    --parchment-deep:#E4D5AC;
    --gold:#B8923F;
    --gold-light:#D9B45E;
    --turquoise:#1E6B6E;
    --turquoise-deep:#144E50;
    --ink:#2B2216;
    --ink-soft:#5C4E36;
  }

  *{ box-sizing:border-box; }

  body{
    margin:0;
    padding:0 0 60px;
    background:
      radial-gradient(circle at 15% 10%, rgba(255,255,255,0.35), transparent 45%),
      radial-gradient(circle at 85% 90%, rgba(0,0,0,0.06), transparent 45%),
      var(--parchment);
    font-family:'Heebo', sans-serif;
    color:var(--ink);
  }

  /* ===== Ornamental header ===== */
  .ornament-frame{
    padding:16px;
    background:var(--parchment-deep);
    border-image-source:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 300 300'><g fill='none' stroke-linecap='round'><path d='M14,96 C14,58 42,22 88,15 C78,17 70,25 71,34 C72,43 82,45 90,39' stroke='%23B8923F' stroke-width='5'/><circle cx='90' cy='38' r='4.5' fill='%23B8923F'/><path d='M27,88 C29,60 50,35 72,27' stroke='%231E6B6E' stroke-width='3'/><circle cx='72' cy='27' r='3.5' fill='%231E6B6E'/><path d='M20,70 C24,58 34,52 42,53' stroke='%23B8923F' stroke-width='2.2'/><path d='M209,15 C255,22 283,58 283,96 C280,86 272,78 263,79 C254,80 251,90 258,97' stroke='%23B8923F' stroke-width='5'/><circle cx='207' cy='38' r='4.5' fill='%23B8923F'/><path d='M225,27 C247,35 268,60 270,88' stroke='%231E6B6E' stroke-width='3'/><circle cx='225' cy='27' r='3.5' fill='%231E6B6E'/><path d='M255,53 C263,52 273,58 277,70' stroke='%23B8923F' stroke-width='2.2'/><path d='M14,204 C14,242 42,278 88,285 C78,283 70,275 71,266 C72,257 82,255 90,261' stroke='%23B8923F' stroke-width='5'/><circle cx='90' cy='262' r='4.5' fill='%23B8923F'/><path d='M27,212 C29,240 50,265 72,273' stroke='%231E6B6E' stroke-width='3'/><circle cx='72' cy='273' r='3.5' fill='%231E6B6E'/><path d='M20,230 C24,242 34,248 42,247' stroke='%23B8923F' stroke-width='2.2'/><path d='M209,285 C255,278 283,242 283,204 C280,214 272,222 263,221 C254,220 251,210 258,203' stroke='%23B8923F' stroke-width='5'/><circle cx='207' cy='262' r='4.5' fill='%23B8923F'/><path d='M225,273 C247,265 268,240 270,212' stroke='%231E6B6E' stroke-width='3'/><circle cx='225' cy='273' r='3.5' fill='%231E6B6E'/><path d='M255,247 C263,248 273,242 277,230' stroke='%23B8923F' stroke-width='2.2'/><path d='M105,45 C120,22 138,60 150,38 C162,60 180,22 195,45' stroke='%23B8923F' stroke-width='5'/><path d='M105,60 C120,42 138,72 150,54 C162,72 180,42 195,60' stroke='%231E6B6E' stroke-width='3'/><circle cx='127' cy='30' r='3.5' fill='%231E6B6E'/><circle cx='173' cy='30' r='3.5' fill='%231E6B6E'/><path d='M105,255 C120,278 138,240 150,262 C162,240 180,278 195,255' stroke='%23B8923F' stroke-width='5'/><path d='M105,240 C120,258 138,228 150,246 C162,228 180,258 195,240' stroke='%231E6B6E' stroke-width='3'/><circle cx='127' cy='270' r='3.5' fill='%231E6B6E'/><circle cx='173' cy='270' r='3.5' fill='%231E6B6E'/><path d='M45,105 C22,120 60,138 38,150 C60,162 22,180 45,195' stroke='%23B8923F' stroke-width='5'/><path d='M60,105 C42,120 72,138 54,150 C72,162 42,180 60,195' stroke='%231E6B6E' stroke-width='3'/><circle cx='30' cy='127' r='3.5' fill='%231E6B6E'/><circle cx='30' cy='173' r='3.5' fill='%231E6B6E'/><path d='M255,105 C278,120 240,138 262,150 C240,162 278,180 255,195' stroke='%23B8923F' stroke-width='5'/><path d='M240,105 C258,120 228,138 246,150 C228,162 258,180 240,195' stroke='%231E6B6E' stroke-width='3'/><circle cx='270' cy='127' r='3.5' fill='%231E6B6E'/><circle cx='270' cy='173' r='3.5' fill='%231E6B6E'/></g></svg>");
    border-image-slice:100 fill;
    border-image-width:34px;
    border-image-repeat:round;
    border-style:solid;
    border-width:34px;
  }

  .ornament-border{
    height:24px;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 60 24'><path d='M0,12 Q10,3 20,12 T40,12 T60,12' stroke='%23B8923F' stroke-width='2' fill='none'/><path d='M0,12 Q10,21 20,12 T40,12 T60,12' stroke='%23B8923F' stroke-width='2' fill='none' opacity='0.55'/><circle cx='10' cy='6' r='2.1' fill='%231E6B6E'/><circle cx='30' cy='18' r='2.1' fill='%231E6B6E'/><circle cx='50' cy='6' r='2.1' fill='%231E6B6E'/><circle cx='20' cy='12' r='1.4' fill='%23B8923F'/><circle cx='40' cy='12' r='1.4' fill='%23B8923F'/></svg>");
    background-repeat:repeat-x;
    background-position:center;
    background-size:60px 24px;
  }

  header{
    background:linear-gradient(180deg, var(--turquoise-deep), var(--turquoise) 85%);
    padding:34px 20px 40px;
    text-align:center;
    position:relative;
    overflow:hidden;
  }

  header::before, header::after{
    content:"";
    position:absolute;
    top:0; bottom:0;
    width:120px;
    background-image:
      radial-gradient(circle at center, transparent 55%, var(--gold-light) 56%, var(--gold-light) 58%, transparent 59%);
    background-size:40px 40px;
    opacity:0.18;
  }
  header::before{ right:0; }
  header::after{ left:0; }

  .star{
    display:inline-block;
    width:26px; height:26px;
    margin:0 10px;
    vertical-align:middle;
    opacity:0.9;
  }

  h1{
    font-family:'Frank Ruhl Libre', serif;
    font-weight:900;
    font-size:clamp(30px, 5vw, 52px);
    color:var(--gold-light);
    margin:6px 0 10px;
    text-shadow:0 2px 10px rgba(0,0,0,0.35);
    letter-spacing:1px;
  }

  .subtitle{
    font-size:16px;
    color:#EFE4C6;
    opacity:0.9;
    margin:0;
    font-weight:300;
    letter-spacing:0.5px;
  }

  main{
    max-width:1180px;
    margin:0 auto;
    padding:38px 20px 0;
  }

  .intro-panel{
    background:var(--parchment-deep);
    border:1px solid rgba(43,34,22,0.25);
    border-radius:4px;
    padding:20px 26px;
    margin-bottom:30px;
    box-shadow:0 2px 8px rgba(43,34,22,0.08);
    font-size:16px;
    line-height:1.7;
  }
  .intro-panel strong{ color:var(--turquoise-deep); }

  .map-frame{
    position:relative;
    background:var(--parchment-deep);
    border:2px solid var(--gold);
    border-radius:6px;
    padding:14px;
    box-shadow:0 4px 18px rgba(43,34,22,0.18);
  }

  .map-frame::before{
    content:"";
    position:absolute;
    inset:6px;
    border:1px solid var(--gold);
    border-radius:3px;
    pointer-events:none;
    opacity:0.6;
  }

  .map-caption{
    text-align:center;
    font-size:13.5px;
    color:var(--ink-soft);
    margin:10px 4px 0;
    font-style:italic;
  }

  svg.map-svg{
    width:100%;
    height:auto;
    display:block;
    border-radius:3px;
    overflow:visible;
  }

  .hotspot{
    cursor:pointer;
    transform-box: fill-box;
    transform-origin: center;
    transition: transform 0.28s cubic-bezier(.2,.8,.3,1.1);
    outline:none;
  }
  .hotspot .hot-shape{
    fill: var(--hcolor);
    fill-opacity: 0;
    stroke: var(--hcolor);
    stroke-opacity:0;
    stroke-width:2.4;
    transition: fill-opacity 0.25s ease, stroke-opacity 0.25s ease, filter 0.25s ease;
  }
  .hotspot:hover, .hotspot:focus-visible{
    transform: scale(1.12);
  }
  .hotspot:hover .hot-shape, .hotspot:focus-visible .hot-shape{
    fill-opacity: 0.55;
    stroke-opacity: 0.95;
    filter: drop-shadow(0 0 6px rgba(0,0,0,0.35));
  }
  .hotspot.patched .hot-shape{
    fill-opacity: 0.42;
  }
  .hotspot.patched:hover .hot-shape, .hotspot.patched:focus-visible .hot-shape{
    fill-opacity: 0.65;
  }

  .hot-label{
    font-family:'Frank Ruhl Libre', serif;
    font-weight:700;
    font-size:15px;
    fill:#fff;
    paint-order: stroke;
    stroke: rgba(20,16,10,0.85);
    stroke-width: 3px;
    stroke-linejoin: round;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s ease;
  }
  .hotspot:hover .hot-label, .hotspot:focus-visible .hot-label{
    opacity: 1;
  }

  footer{
    max-width:1180px;
    margin:26px auto 0;
    padding:0 20px;
    font-size:12px;
    color:var(--ink-soft);
    line-height:1.6;
    text-align:center;
  }
</style>
</head>
<body>

<div class="ornament-border"></div>
<header>
  <h1>יהדות ארצות האסלאם</h1>
</header>
<div class="ornament-border"></div>

<main>

  <div class="intro-panel">
